<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Attendance at WiBo Corp</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />

<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>
</head>

<body>
  <div class="app-shell">
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <div class="app">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Toggle sidebar">☰</button>
          <div class="brand">
            <span class="brand-mark">W</span>
            <div class="brand-text">
              <span class="brand-name">WiBo Corp</span>
              <span class="brand-sub">Attendance Terminal</span>
            </div>
          </div>
        </div>

        <nav class="nav">
          <button id="navAttendance" class="nav-item is-active" type="button">
            <span class="nav-icon">🕒</span><span class="nav-text">Attendance</span>
          </button>
          <button id="navHoliday" class="nav-item" type="button">
            <span class="nav-icon">📅</span><span class="nav-text">Holiday</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <small>Internal use only &middot; WiBo Corp HR Systems</small>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="topbar">
          <h1 id="pageTitle">Attendance</h1>
          <div class="clock" aria-live="off">
            <span class="clock-dot"></span>
            <span class="clock-time" id="clockTime">--:--:--</span>
            <span class="clock-date" id="clockDate">--- -- ---</span>
          </div>
        </div>

        <!-- Attendance View -->
        <section id="viewAttendance" class="view is-active">
          <div class="card">
            <div class="field">
              <label class="field-label" for="employeeSelect">Employee</label>
              <div class="select-wrap">
                <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M5 19.2c1.2-3.4 4-5.2 7-5.2s5.8 1.8 7 5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <select id="employeeSelect">
                  <option value="">Select your name</option>
                </select>
              </div>
            </div>

            <div class="buttons">
              <button class="attend" id="attendBtn">
                <span class="btn-icon">↗</span>
                <span>Attend</span>
                <span class="btn-shine"></span>
              </button>
              <button class="leave" id="leaveBtn">
                <span class="btn-icon">↙</span>
                <span>Leave</span>
                <span class="btn-shine"></span>
              </button>
            </div>

            <p class="helper">Select your name, then confirm. Times are recorded in IST.</p>
          </div>
        </section>

        <!-- Holiday View -->
        <section id="viewHoliday" class="view">
          <div class="calendar-card">
            <div class="cal-head">
              <div class="cal-head-left">
                <span class="cal-eyebrow">Company Holidays</span>
                <div class="cal-title">
                  <span id="calMonthLabel">-- ----</span>
                </div>
              </div>
              <div class="cal-head-right">
                <button class="cal-today-btn" id="calTodayBtn" type="button">Today</button>
                <button class="cal-nav" id="calPrevBtn" type="button" aria-label="Previous month">‹</button>
                <button class="cal-nav" id="calNextBtn" type="button" aria-label="Next month">›</button>
              </div>
            </div>
            <div class="cal-weekdays" id="calWeekdays"></div>
            <div class="cal-grid" id="calGrid"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module">
    const timeEl = document.getElementById('clockTime');
    const dateEl = document.getElementById('clockDate');
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

    function tick() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const ist = new Date(utc + 5.5 * 60 * 60 * 1000);
      const hh = String(ist.getHours()).padStart(2, '0');
      const mm = String(ist.getMinutes()).padStart(2, '0');
      const ss = String(ist.getSeconds()).padStart(2, '0');
      timeEl.textContent = `${hh}:${mm}:${ss}`;
      dateEl.textContent = `${days[ist.getDay()]} ${ist.getDate()} ${months[ist.getMonth()]} · IST`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
