<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance Admin</title>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --line2: #d1d5db;
      --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
      --radius: 16px;
      --radius-sm: 12px;
      --sidebar-w: 260px;
      --focus: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Pretendard, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
    }

    /* Sidebar */
    .sidebar {
      background: #0b1220;
      color: #e5e7eb;
      padding: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 4px 12px;
    }
    .brand .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #fff;
    }
    .brand .sub {
      font-size: 12px;
      color: rgba(229,231,235,0.7);
      line-height: 1.3;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .nav button {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.06s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .nav button:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
    }
    .nav button:active { transform: translateY(1px); }
    .nav button:focus { outline: none; box-shadow: var(--focus); }

    .sidebar .hint {
      margin-top: auto;
      font-size: 12px;
      color: rgba(229,231,235,0.65);
      line-height: 1.4;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
    }

    /* Main */
    .main {
      padding: 28px 28px 40px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .header .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .card + .card { margin-top: 16px; }

    /* PIN card */
    .pin-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    input[type="password"] {
      border: 1px solid var(--line2);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      min-width: 220px;
      background: #fff;
    }
    input[type="password"]:focus {
      outline: none;
      box-shadow: var(--focus);
      border-color: rgba(59,130,246,0.5);
    }

    .btn {
      border: 1px solid var(--line2);
      background: #111827;
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.06s ease, opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: translateY(1px); }
    .btn:focus { outline: none; box-shadow: var(--focus); }

    .btn.secondary {
      background: #fff;
      color: #111827;
    }

    .btn.danger {
      background: #fff;
      color: #dc2626;
      border-color: #fecaca;
      font-size: 13px;
      white-space: nowrap;
    }
    .btn.danger:hover {
      background: #fef2f2;
    }

    .btn.download {
      background: #fff;
      color: #059669;
      border-color: #a7f3d0;
      font-size: 13px;
      white-space: nowrap;
    }
    .btn.download:hover {
      background: #ecfdf5;
    }

    .month-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      flex: 1;
      min-width: 0;
    }

    .month-tab-btn {
      border: 1px solid var(--line2);
      background: #fff;
      color: #111827;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .month-tab-btn:hover { background: #f3f4f6; }
    .month-tab-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .history-day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-delete-day {
      border: 1px solid #fecaca;
      background: #fff;
      color: #dc2626;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-delete-day:hover { background: #fef2f2; }

    .error {
      color: #dc2626;
      margin: 10px 0 0;
      font-size: 13px;
    }

    /* Table (Excel friendly: keep true <table>) */
    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
    }

    table {
      border-collapse: collapse; /* Excel copy friendly */
      width: 100%;
      min-width: 520px;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #f3f4f6;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:nth-child(even) td { background: #fafafa; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 800;
    }

    .history-day {
      margin-top: 14px;
    }
    .history-day h4 {
      margin: 18px 0 10px;
      font-size: 14px;
      font-weight: 800;
      color: #111827;
    }

    /* Responsive */
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .main { padding: 18px; }
      table { min-width: 520px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="title">Attendance Admin</div>
        <div class="sub">Clean dashboard • Excel-friendly tables</div>
      </div>

      <div class="nav">
        <button id="navToday">📌 Today</button>
        <button id="navHistory">🗂️ History</button>
        <button id="navCalendar">🗓️ Calendar</button>
      </div>

      <div class="hint">
        • 테이블은 복사해서 엑셀에 붙여넣기 쉬운 형태로 유지됩니다.<br />
        • History가 안 보이면 권한/Rules 문제일 수 있어요.
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- PIN 입력 -->
      <section id="pinSection" class="card">
        <div class="header" style="margin-bottom: 6px;">
          <div>
            <h1>Admin Access</h1>
            <div class="meta">관리자 PIN을 입력해 주세요.</div>
          </div>
        </div>

        <div class="pin-row">
          <input type="password" id="pinInput" placeholder="Enter PIN" />
          <button class="btn" id="pinBtn">Enter</button>
        </div>
        <p id="pinError" class="error"></p>
      </section>

      <!-- 관리자 화면 -->
      <section id="adminSection" style="display:none;">
        <div class="card">
          <div class="header">
            <div>
              <h1 id="title">Today's Attendance</h1>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Attend</th>
                  <th>Leave</th>
                </tr>
              </thead>
              <tbody id="attendanceTable"></tbody>
            </table>
          </div>

          <div class="actions">
            <button class="btn secondary" id="toggleHistory">View more ▼</button>
            <button class="btn download" id="downloadTodayBtn">⬇️ 오늘 데이터 다운로드 (CSV)</button>
          </div>
        </div>

        <div id="historySection" class="card" style="display:none;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
            <h2 class="section-title" style="margin:0;">History</h2>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn download" id="downloadHistoryBtn">⬇️ 전체 History 다운로드 (CSV)</button>
              <button class="btn danger" id="deleteAllHistoryBtn">🗑 지난 기록 전체 삭제 (오늘 제외)</button>
            </div>
          </div>

          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
            <div id="monthTabs" class="month-tabs"></div>
            <button class="btn download" id="downloadMonthBtn" style="flex-shrink:0;">⬇️ 이 달 다운로드 (CSV)</button>
          </div>

          <div id="historyContainer"></div>
        </div>

        <div id="calendarSection" class="card" style="display:none;">
          <div class="header" style="margin-bottom: 6px;">
            <div>
              <h2 class="section-title" style="margin:0;">Calendar</h2>
              <div class="meta">회사 일정을 추가하고 관리합니다.</div>
            </div>
          </div>

          <div class="pin-row" style="margin-top:10px;">
            <input type="date" id="calendarDateInput" />
            <input
              type="text"
              id="calendarTitleInput"
              placeholder="이벤트 내용 (예: 팀 회식, 홍길동 휴가)"
              style="flex:1; min-width:220px; border:1px solid var(--line2); border-radius:12px; padding:10px 12px; font-size:14px;"
            />
            <button class="btn" id="calendarAddBtn">추가</button>
          </div>
          <p id="calendarError" class="error"></p>

          <div id="calendarListContainer" style="margin-top:16px;"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="admin.js"></script>

  <!-- Sidebar buttons (admin.js 수정 없이 연결) -->
  <script type="module">
    const navToday = document.getElementById("navToday");
    const navHistory = document.getElementById("navHistory");
    const navCalendar = document.getElementById("navCalendar");
    const adminSection = document.getElementById("adminSection");
    const toggleHistory = document.getElementById("toggleHistory");
    const historySection = document.getElementById("historySection");
    const calendarSection = document.getElementById("calendarSection");

    navToday.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    navHistory.addEventListener("click", () => {
      // PIN 통과 후에만 동작
      if (adminSection.style.display === "none") return;

      // history가 닫혀있으면 토글 버튼으로 열기
      const isOpen = historySection.style.display === "block";
      if (!isOpen) toggleHistory.click();

      // 열리고 난 뒤 위치로 스크롤
      setTimeout(() => {
        historySection.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    });

    navCalendar.addEventListener("click", () => {
      // PIN 통과 후에만 동작
      if (adminSection.style.display === "none") return;

      // calendar 섹션이 닫혀있으면 열기 (admin.js의 window.openCalendarSection 사용)
      const isOpen = calendarSection.style.display === "block";
      if (!isOpen && window.openCalendarSection) {
        window.openCalendarSection();
      }

      setTimeout(() => {
        calendarSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    });
  </script>
</body>
</html>
